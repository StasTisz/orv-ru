<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../../assets/manifest.json">
    <link rel="shortcut icon" href="../../assets/media/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/story.css">
    <title>{{STORY_TITLE}} — ORV-RU</title>
    <meta name="description" content="{{STORY_TITLE}} — оглавление и описание">
</head>
<body>
    <div class="background" aria-hidden="true"></div>
    <a href="../index.html" class="back" aria-label="К списку историй">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="#e3e3e3" aria-hidden="true"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
    </a>

    <div class="story-layout" id="story-app"
         data-slug="{{STORY_SLUG}}"
         data-meta="../../meta/{{STORY_SLUG}}_meta.json"
         data-chapters="../../meta/{{STORY_SLUG}}.json"
         data-first-href="{{FIRST_CHAPTER_HREF}}">
        <aside class="info">
            <div class="cover">
                <img src="../../assets/media/covers/{{STORY_SLUG}}.webp" alt="Обложка: {{STORY_TITLE}}">
            </div>
            <div class="read-btn">
                <a id="read-link" href="{{FIRST_CHAPTER_HREF}}">
                    <button id="read-btn" type="button"{{READ_BTN_DISABLED_ATTR}}>{{READ_BTN_TEXT}}</button>
                </a>
            </div>
            <div class="status" id="story-meta">
                <p class="story-title">{{STORY_TITLE}}</p>
                <p>Автор: {{STORY_AUTHOR}}<br>Глав: {{CHAPTER_COUNT}}<br>Статус: {{STORY_STATUS}}</p>
            </div>
            <div class="synopsis">
                <p>{{STORY_SYNOPSIS}}</p>
            </div>
        </aside>

        <section class="chapters" aria-label="Список глав">
            <div class="ch-container">
                <button id="sort-toggle" type="button" title="Сменить порядок глав" aria-label="Сортировка глав">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="#e3e3e3" aria-hidden="true"><path d="M120-240v-80h240v80H120Zm0-200v-80h480v80H120Zm0-200v-80h720v80H120Z"/></svg>
                </button>
                <input type="search" id="chapter-search" placeholder="Поиск по главам">
            </div>
            <div id="chapter-list" class="chapter-list">{{INITIAL_CHAPTER_ITEMS}}</div>
        </section>
    </div>

    <script src="../../assets/js/storage.js"></script>
    <script src="../../assets/js/story.js"></script>
</body>
</html>
